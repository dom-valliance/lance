name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# One run per ref. A new push supersedes whatever is still running for that ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default. Only the bicep job widens this, and only for OIDC.
permissions:
  contents: read

jobs:
  checks:
    name: Lint, typecheck, test and build
    runs-on: ubuntu-latest
    env:
      TURBO_TELEMETRY_DISABLED: 1
      DO_NOT_TRACK: 1
      # Corepack only prompts on a terminal, but be explicit for future runners.
      COREPACK_ENABLE_DOWNLOAD_PROMPT: 0
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # Corepack runs after setup-node so the pnpm shim lands on the Node that
      # setup-node put on the PATH. The version comes from packageManager.
      - name: Enable corepack
        run: corepack enable

      - name: Resolve the pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache the pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Check formatting
        run: pnpm format:check

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # The db and ledger suites start this image through testcontainers, so it
      # has to exist in the local daemon before pnpm test runs.
      - name: Build the local Postgres image
        uses: docker/build-push-action@v6
        with:
          context: infra/docker/postgres
          load: true
          tags: lance-postgres:16
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # Coverage is the gate for packages/policy, so keep the report even when a
      # later step fails. The hashFiles guard skips the upload when no report
      # was written.
      - name: Upload the policy coverage report
        if: ${{ !cancelled() && hashFiles('packages/policy/coverage/**') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: policy-coverage
          path: packages/policy/coverage
          if-no-files-found: ignore
          retention-days: 14

  images:
    name: Build the container images
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [api, web, worker]
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Every Dockerfile copies an explicit list of workspace sources, so a new
      # workspace dependency that the list does not name fails here, on the
      # pull request, rather than in the registry build after merge. Nothing
      # is pushed.
      - name: Build the ${{ matrix.app }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: false
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  migration-guard:
    name: Forward-only migration guard
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Check migrations for destructive statements
        run: ./scripts/check-migrations.sh

  bicep:
    name: Bicep build, lint and what-if
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required by azure/login for the OIDC token exchange.
      id-token: write
    # The secrets context is not available in a job-level if, nor in a step-level
    # if. The documented way to gate on a secret is to map it into env at job
    # level and test that env value in the step condition, which is what the
    # what-if steps below do.
    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      # Downloads the latest release binary from the Bicep repository. The
      # checksum verification step is deliberately skipped for now; add it when
      # the pinned version and its published hash are agreed.
      - name: Install the Bicep CLI
        run: |
          curl -fsSL -o bicep https://github.com/Azure/bicep/releases/latest/download/bicep-linux-x64
          chmod +x bicep
          sudo mv bicep /usr/local/bin/bicep
          bicep --version

      - name: Build the Bicep template
        run: bicep build infra/main.bicep

      - name: Lint the Bicep template
        run: bicep lint infra/main.bicep

      - name: Log in to Azure with OIDC
        if: env.AZURE_CLIENT_ID != ''
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: what-if
        if: env.AZURE_CLIENT_ID != ''
        run: |
          az deployment sub what-if \
            --location uksouth \
            --template-file infra/main.bicep \
            --parameters infra/params/dev.bicepparam

      - name: Report that what-if was skipped
        if: env.AZURE_CLIENT_ID == ''
        run: echo "What-if skipped because no Azure credentials are configured for this repository."

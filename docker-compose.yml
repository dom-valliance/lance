services:
  postgres:
    image: lance-postgres:16
    build:
      context: ./infra/docker/postgres
    ports:
      - '5432:5432'
    environment:
      POSTGRES_DB: lance
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/docker/postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d lance']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
